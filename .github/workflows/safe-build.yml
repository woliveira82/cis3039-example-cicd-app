name: Safe Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-build:
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://localhost:7071/api/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - name: Verify vulnerabilities deps
        # fail on high/critical in production deps
        # skips tooling that never reach the browser
        run: npm audit --omit=dev --audit-level=high
           
      - name: Run type check
        run: npm run type-check

      - name: Build
        run: npm run build
